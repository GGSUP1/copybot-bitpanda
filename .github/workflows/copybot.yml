name: copybot

on:
  schedule:
    - cron: "7,37 * * * *"   # ogni 30 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch: {}       # avvio manuale dal tab Actions
  push:                       # parte anche quando cambiano codice o configurazione
    branches: [main]
    paths: ["bot.py", "config.json", ".github/workflows/copybot.yml"]

permissions:
  contents: write

concurrency:
  group: copybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controllo dei wallet (SIMULAZIONE)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BITPANDA_API_KEY: ${{ secrets.BITPANDA_API_KEY }}
        run: |
          set -o pipefail
          # Sicurezza: su GitHub il bot gira SOLO in simulazione
          python3 -c "import json,sys; c=json.load(open('config.json')); sys.exit('mode deve essere paper' if c.get('mode')!='paper' else 0)"
          python3 bot.py once 2>&1 | tee -a bot.log

      - name: Salvo stato e operazioni nel repository
        if: always()
        run: |
          git config user.name "copybot"
          git config user.email "copybot@users.noreply.github.com"
          git add state.json bot.log trades.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "copybot: aggiornamento $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
